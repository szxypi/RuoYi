spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    druid:
      master:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        username: sa
        password:
      # Druid 连接池配置
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  quartz:
    job-store-type: memory
    auto-startup: false

mybatis:
  type-aliases-package: com.zjjh.fdtemp.beans.**
  mapper-locations: classpath*:mapper/**/*Dao.xml
  configuration:
    map-underscore-to-camel-case: false

pagehelper:
  helper-dialect: hsqldb
  reasonable: true
  support-methods-arguments: true

app:
  name: fdtemp
  version: 1.0.0
  copyrightYear: 2026
  demoEnabled: false
  profile: /tmp/uploadPath

jwt:
  secret: fdtempJwtSecretKeyForTestingPurposesOnlyMinimum256BitsRequired
  expiration: 86400000
  refreshExpiration: 604800000
  header: Authorization
  prefix: Bearer

security:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With
  token-blacklist:
    mode: db

logging:
  level:
    com.zjjh.fdtemp: DEBUG
