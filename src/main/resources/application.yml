# 项目相关配置
app:
  # 名称
  name: fdtemp
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径（默认当前目录下 upload 文件夹，可通过环境变量 APP_UPLOAD_PATH 覆盖）
  profile: ${APP_UPLOAD_PATH:./upload}
  # 获取ip地址开关
  addressEnabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 80
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 20

# 日志配置
logging:
  level:
    com.zjjh.fdtemp: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: static/i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zjjh.fdtemp.beans.**
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Dao.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# JWT配置
jwt:
  # JWT密钥（Base64编码，至少32字节；生产环境务必通过 JWT_SECRET 环境变量覆盖）
  secret: ${JWT_SECRET:WTmEFR+C4oGYuTMATXaEARBt1kBKHS8d+H1ipnLe7UdxpA/xKNgeeaHLBv6HsKLI}
  # token有效期（毫秒），默认24小时
  expiration: 86400000
  # refresh token有效期（毫秒），默认7天
  refreshExpiration: 604800000
  # token请求头
  header: Authorization
  # token前缀
  prefix: "Bearer "

# 安全配置
security:
  cors:
    # 企业环境请按实际前端域名配置，多个用逗号分隔
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With
  token-blacklist:
    # memory: 单机内存模式; db: 数据库存储（多实例建议）
    mode: db

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: 'API接口'
      paths-to-match: '/**'
      packages-to-scan: com.zjjh.fdtemp.controller

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
